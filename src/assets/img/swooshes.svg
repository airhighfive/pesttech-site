<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Background swooshes for wide screens (site.css, body::before): brand blue at low opacity over the dot dither.
       The middle of each curve sits behind the white sheet, so the lines read as passing behind the page. -->
  <g fill="none" stroke="#21699E" stroke-linecap="round">
    <!-- Two broad, soft bands -->
    <path d="M-240 930 C 180 700 560 1040 980 790 S 1660 430 2160 590" stroke-width="190" stroke-opacity=".045"/>
    <path d="M-240 330 C 220 170 560 500 990 350 S 1660 120 2160 250" stroke-width="64" stroke-opacity=".06"/>
    <!-- Dotted lines riding the edges of the bands, echoing the dither -->
    <path d="M-240 810 C 180 580 560 920 980 670 S 1660 310 2160 470" stroke-width="4" stroke-dasharray="0 13" stroke-opacity=".3"/>
    <path d="M-240 384 C 220 224 560 554 990 404 S 1660 174 2160 304" stroke-width="3.5" stroke-dasharray="0 11" stroke-opacity=".28"/>
    <!-- Two hairlines -->
    <path d="M-240 1030 C 380 880 700 1090 1120 910 S 1720 660 2160 720" stroke-width="1.5" stroke-opacity=".2"/>
    <path d="M-240 160 C 300 60 660 250 1010 140 S 1620 0 2160 90" stroke-width="1.5" stroke-opacity=".16"/>
  </g>
</svg>
